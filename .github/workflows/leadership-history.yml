name: Leadership History Refresh (Weekly)

# Runs CEO/leadership career history fetch (Wikidata) weekly on Monday 04:00 UTC
# + manual trigger for ad-hoc refreshes
#
# CEO tracker builds data/leadership/ database from people listed in data/company/*.json.
# For each person, pulls their employer history + positions held over time via Wikidata P108/P39.
# This step is very slow (~1-2s per query, ~2 queries per person) so it's separated 
# from nightly refresh and runs weekly on Monday (after company facts runs Sunday).

on:
  schedule:
    - cron: '0 4 ? * MON'  # Every Monday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: trapp2-leadership
  cancel-in-progress: false

jobs:
  refresh-leadership:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Fetch CEO/leadership career history (Wikidata)
        # Builds data/leadership/ database from people listed in data/company/*.json.
        # For each person, pulls their employer history + positions held over time
        # via Wikidata P108/P39. Cross-references which other tickers share board members.
        # Slow step (~1s per query, ~2 queries per person) — runs only weekly.
        run: |
          echo "=== company files available to CEO tracker ==="
          ls data/company/ | grep -v '^_' | wc -l
          echo "tickers"
          echo "=== running fetch_ceo_tracker.py ==="
          python pipeline/fetch_ceo_tracker.py || echo "CEO tracker step had errors but continuing"
          echo "=== leadership files after run ==="
          ls -la data/leadership/by_ticker/ 2>/dev/null | wc -l || echo "no by_ticker dir"
          ls -la data/leadership/by_person/ 2>/dev/null | wc -l || echo "no by_person dir"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every file under data/leadership/
          git add -A data/leadership/
          # Show what's about to be committed (useful for debugging in workflow logs)
          echo "=== git status before commit ==="
          git status --short
          echo "=== files staged ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No leadership changes to commit"
          else
            git commit -m "Leadership history refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Push with retry — if remote moved (another workflow committed in parallel),
            # rebase our commit on top and retry. --autostash here is harmless because
            # all our changes are already committed.
            for i in 1 2 3; do
              if git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push attempt $i failed, rebasing and retrying"
              git pull --rebase --autostash origin main || git pull --rebase --autostash origin master
              sleep 4
            done
          fi
