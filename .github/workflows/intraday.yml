name: Live Quotes (Intraday)

# Runs every 15 minutes during US market hours (9 AM - 4:45 PM ET), Mon-Fri.
# UTC schedule covers both EST (UTC-5) and EDT (UTC-4):
#   EDT 9:00 AM = 13:00 UTC, EST 9:00 AM = 14:00 UTC
#   EDT 4:45 PM = 20:45 UTC, EST 4:45 PM = 21:45 UTC
# So we run 13:00-21:45 UTC. This means a slightly early start in winter and
# slightly late end in summer, but never misses market hours.
#
# Only runs fetch_data.py — quick (~30s), refreshes master.csv master.json only.
# Heavy 5-year history fetch and regime recompute happen in nightly/midday workflows.

on:
  schedule:
    - cron: '0,15,30,45 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trapp2-quotes
  cancel-in-progress: false   # don't kill a run mid-fetch

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Fetch live quotes
        run: python pipeline/fetch_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/master.csv data/master.json data/.profile_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No quote changes to commit"
          else
            git commit -m "Live quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git push && break
              echo "Push attempt $i failed, retrying after rebase"
              sleep 4
              git pull --rebase --autostash
            done
          fi
