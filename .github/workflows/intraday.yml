name: Live Quotes (Intraday)

# Runs every 15 minutes during US market hours (9 AM - 4:45 PM ET), Mon-Fri.
# UTC schedule covers both EST (UTC-5) and EDT (UTC-4):
#   EDT 9:00 AM = 13:00 UTC, EST 9:00 AM = 14:00 UTC
#   EDT 4:45 PM = 20:45 UTC, EST 4:45 PM = 21:45 UTC
#
# IMPORTANT: GitHub Actions scheduled workflows have known random latency
# (often 15-60 minutes during peak load — workflows are queued, not strict).
# To compensate, we START the cron 30 minutes BEFORE the open (12:30 UTC),
# giving us pre-market warmup runs so the first real-market refresh lands
# at or near the bell, even if GitHub queues us late.
#
# We also run every 10 minutes during the first hour after open to catch
# any backlog, then every 15 minutes the rest of the day.
#
# Only runs fetch_data.py — quick (~30s), refreshes master.csv master.json only.
# Heavy 5-year history fetch and regime recompute happen in nightly/midday workflows.

on:
  schedule:
    # Pre-market warmup: 12:30, 12:45 UTC (covers EDT 8:30/8:45 and EST 7:30/7:45)
    - cron: '30,45 12 * * 1-5'
    # Open hour through close: every 15 min from 13:00 to 21:45 UTC
    - cron: '0,15,30,45 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trapp2-quotes
  cancel-in-progress: false   # don't kill a run mid-fetch

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Fetch live quotes
        run: python pipeline/fetch_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.csv data/master.json data/.profile_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No quote changes to commit"
          else
            git commit -m "Live quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push attempt $i failed, rebasing and retrying"
              git pull --rebase --autostash origin main || git pull --rebase --autostash origin master
              sleep 4
            done
          fi
