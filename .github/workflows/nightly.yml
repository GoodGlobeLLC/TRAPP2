name: Nightly Full Refresh

# Once nightly: fetch quotes, fetch 5y history, fetch FRED macro,
# recompute signals + regime + Markov transitions.
#
# 00:00 UTC = 7:00 PM ET (EST) / 8:00 PM ET (EDT)
# Picks up the official daily close which posts ~5:30 PM ET.

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC daily
  workflow_dispatch:      # manual "Run workflow" button

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'yfinance>=0.2.50,<0.3'

      # 1. Quotes (uses cached fundamentals from data/.profile_cache.json
      #    so .info is only re-pulled once every 24h)
      - name: Fetch quotes + fundamentals
        run: python pipeline/fetch_data.py

      # 2. 5-year per-ticker price history (the big one — only runs nightly)
      - name: Fetch 5-year price history
        run: python pipeline/fetch_history.py

      # 3. FRED macro series (skipped gracefully if FRED_API_KEY not set)
      - name: Fetch FRED macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/fetch_macro.py

      # 4. Phase 2 → Phase 3 → Phase 4 of the regime engine
      - name: Compute signals
        run: python pipeline/compute_signals.py

      - name: Classify regime + append history snapshot
        run: python pipeline/classify_regime.py

      - name: Compute Markov transitions
        run: python pipeline/compute_transitions.py

      - name: Commit and push everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Nightly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Push attempt $i failed, retrying…"
              sleep 5
            done
          fi
